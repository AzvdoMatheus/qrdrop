<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QRDrop</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>QRDrop</h1>
      <span id="status" class="status status--unknown">verificando…</span>
    </header>

    <main>
      <div id="offline" class="offline hidden">
        <p><strong>Daemon offline.</strong></p>
        <p id="offlineHint" class="muted">O daemon não está rodando.</p>
        <button id="startDaemon" type="button" class="hidden">Iniciar daemon</button>
        <div id="offlineManual" class="hidden">
          <p class="muted">Instale o atalho uma vez (registra o start automático):</p>
          <pre><code>cd extension &amp;&amp; ./install.sh</code></pre>
          <p class="muted">Ou suba manualmente:</p>
          <pre><code>cd daemon &amp;&amp; npm run dev</code></pre>
        </div>
      </div>

      <div id="dropzone" class="dropzone" tabindex="0">
        <svg class="dropzone__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 15V3" />
          <path d="m8 7 4-4 4 4" />
          <path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4" />
        </svg>
        <p class="dropzone__lead">Arraste um arquivo para enviar</p>
        <p class="dropzone__or muted">ou</p>
        <button id="picker" type="button">Escolher arquivo</button>
        <input id="fileInput" type="file" hidden />
      </div>

      <ul id="queue" class="queue"></ul>
    </main>

    <template id="itemTemplate">
      <li class="item">
        <div class="item__head">
          <span class="item__name"></span>
          <span class="item__size muted"></span>
        </div>
        <div class="item__progress"><div class="item__bar"></div></div>
        <div class="item__status muted"></div>
        <div class="item__qr hidden">
          <div class="item__pass"><canvas></canvas></div>
          <div class="item__url"></div>
          <div class="item__ttl"></div>
        </div>
      </li>
    </template>

    <script type="module" src="index.js"></script>
  </body>
</html>
